<html>
  <head>
    <title>EDF RDDI Stand Up</title>
    <link rel="stylesheet" type="text/css" href="stylesheets/css/main.css">
    <!-- <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/x-icon" href="./favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <style id="name-wheel-style"></style>
  </head>
  <body>
    <header>
      <div class="container">
        <h1 id="title">Digital Innovation - Stand Up</h1>
        <div class="left">
          <div id="mute-button" class="header-button">
            <input id="mute-input" type="checkbox" name="mute" class="option-control"/>
            <label class="icon" for="mute-input">
              <i class="fa fa-volume-up"></i>
              <i class="fa fa-volume-off"></i>
            </label>
          </div>
        </div>
        <div class="right">
          <a class="header-button" id="settings-button">
            <div class="icon">
              <i class="fa fa-gear"></i>
              <i class="fa fa-lock"></i>
            </div>
            <div class="corner t"></div>
            <div class="corner r"></div>
            <div class="corner b"></div>
            <div class="corner l"></div>
          </a>
        </div>
      </div>
      <div class="container collapser closed">
        <form id="input-form">
          <div class="tab-holder">
            <div class="select-strip">
              <input id="useRegister" type="checkbox" name="useRegister" class="option-checkbox option-control" func="setRegister"/>
              <label id="use-register" for="useRegister" data-info="Do you want the team to use the client app?">Use Register</label>
            </div>
            <div class="tab">
              <label class="heading">Team<div id="edit-team" class="edit-button"><i class="fa fa-pen-to-square"></i></div></label>
              <div class="select-strip" id="team-members"></div>
            </div>
            <div class="tab hidden">
              
              <label id="register-title" class="heading">Register</label>
              <div class="register-holder">
                
                <div class="select-strip" id="register-display"></div>
                <div id="meeting-code" class="meeting-code"></div>
                <!-- <div id="open-registration" class="selection-button"><i class="fa fa-door-closed"></i></div>
                
                <div id="close-registration" class="selection-button hidden"><i class="fa fa-door-open"></i></div> -->
                <div id="open-registration" class="selection-button">Open</div>
                <div id="close-registration" class="selection-button hidden">Close</div>
              </div>
            </div>
          </div>
          <label class="heading">Duration</label>
          <div class="select-strip">
          <div>
            <input id="time-slider" type="range" name="duration" value="1" class="set-check" min="1" max="60"/>

            <input id="pp" type="checkbox" name="pp" class="option-checkbox option-control"/>
            <label for="pp" class="lock-width" data-info="Do you want the time to be per person?">pp</label>
          </div>
        
            <div id="duration-display"></div>
          </div>
          <label class="heading">Options</label>
          <div class="select-strip" id="options">
            <input id="pausable" type="checkbox" name="pausable" class="option-checkbox option-control"/>
            <label for="pausable" class="tooltip" data-info="Do you want a pause button on the timer?">Pause Button</label>
            <input id="skipable" type="checkbox" name="skipable" class="option-checkbox option-control"/>
            <label for="skipable" class="tooltip" data-info="Do you want a skip button on the timer?">Skip Button</label>
            <input id="collect-time" type="checkbox" name="collectTime" class="option-checkbox option-control"/>
            <label for="collect-time" class="tooltip" data-info="Do you want a team member's unused time to be split amongst everyone else?">Collect Time</label>
            <input id="pep-talk" type="checkbox" name="pepTalk" class="option-checkbox option-control" data-linked-on="wordVote"/>
            <label for="pep-talk" class="tooltip" data-info="Do you want to randomly select a pep talker at the end of the timer?">Pep Talk</label>
            <input id="word-vote" type="checkbox" name="wordVote" class="option-checkbox option-control" data-linked-off="pepTalk"/>
            <label for="word-vote" class="tooltip" data-info="Do you want the team to vote on a word for the pep talk?">Word Vote</label>
            <input id="emotable" type="checkbox" name="emotable" class="option-checkbox option-control" data-linked-off="emotable"/>
            <label for="emotable" class="tooltip" data-info="Do you want the team to be able to send emotes during the meeting?">Emotes</label>
          </div>
          <input id="set-button" type="submit" value="Set" class="button disabled"></input>
          <div class="save-load-section">
            <div id="save-button" class="button selection-button disabled">Save</div>
            <div id="load-button" class="button selection-button">Load</div>
          </div>
        </form>
        
      </div>
    </header>
    <div class="container pad">
      <div class="active-team-list" id="left-list">

      </div>
      <div class="active-team-list" id="right-list">

      </div>
      <div id="name-wheel"></div>
      <div id="name-obscurer"></div>
      <div id="timer" class="timer">
        <div class="hand-holder">
          <div class="hand"></div>
        </div>
        <div class="hand-holder right">
          <div class="hand"></div>
        </div>
        <div class="timer-display">00:00</div>

        <div class="backing"></div>

      </div>

      <div id="sub-timer" class="timer">
        <div class="hand-holder">
          <div class="hand"></div>
        </div>
        <div class="hand-holder right">
          <div class="hand"></div>
        </div>
        <div class="timer-display">00:00</div>
        <a id="pause-button" class="button symbol paused hidden">
          <i class="fa fa-play pos-main"></i>
        <a id="end-button" class="button symbol hidden">
          <i class="fa fa-stop pos-main"></i>
        </a>
        <a id="reset-button" class="button hidden">RESET</a>
        <a id="next-button" class="button symbol hidden">
          <i class="fa fa-step-forward pos-main"></i>
        </a>
        <a id="pep-button" class="button hidden">PEP TALK</a>
      </div>

      <div id="team-remaining">0/0</div>

      <div id="end-screen" class="hidden">
        <div>You achieved a <span id="end-time"></span> stand up, with an average of <span id="avg-time"></span> per person</div>
      </div>
    </div>

    <div id="pep-talk-modal" class="modal hidden">
      <div id="pep-talk-container" class="container">
        <i id="pep-talk-modal-close" class="fa fa-times modal-close"></i>
        <i id="pep-talk-respin" class="fa fa-refresh modal-button"></i>
        <div id="pep-display"></div>
        <div id="vote-count"></div>
      </div>
  </div>

    <div id="team-modal" class="modal hidden">
      
      <div class="container">
        <span id="team-modal-close" class="fa fa-times modal-close"></span>
        <h2>Manage Team</h2>
        <input type="text" id="meeting-name-input" name="meeting-name" placeholder="Team name"/>
        <div id="team-editor">
          <div id="team-editor-list">

          </div>
          <div class="member-name-input">
            <input type="text" id="member-name-input" name="member-name" placeholder="Add Member"/>
          </div>

        </div>
      </div>
    </div>

    <div id="save-modal" class="modal hidden">
      <div class="container">
        <span id="save-modal-close" class="fa fa-times modal-close"></span>
        <h2>Save Meeting</h2>
        <div id="save-editor">
          <div class="save-name-input">
            <input type="text" id="save-name-input" name="save-name" placeholder="Meeting name"/>
          </div>
          <div id="save-settings-button" class="button">Save</div>
        </div>
      </div>
    </div>


    <div id="load-modal" class="modal hidden">
      <div class="container">
        <span id="load-modal-close" class="fa fa-times modal-close"></span>
        <h2>Load Meeting</h2>
        <div id="load-editor">
          <div id="load-editor-list">

          </div>
        </div>
      </div>
    </div>

    <div id="qr-code-modal" class="modal hidden">
      <div class="container">
        <div id="qr-meeting-code" class="meeting-code connected"></div>
        <span id="qr-code-modal-close" class="fa fa-times modal-close"></span>
        <h2>Client QR</h2>
        <img id="qr-code"/>
      </div>
    </div>

    <div id="version"></div>

    <div id="emotes-container">
    </div>

    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script type="text/javascript" src="scripts/utilities.js"></script>
    <script type="text/javascript" src="scripts/timer.js"></script>
    <script type="text/javascript" src="scripts/sound.js"></script>
    <script type="text/javascript" src="scripts/memory.js"></script>
    <script type="text/javascript" src="scripts/comms.js"></script>
    <script type="text/javascript" src="scripts/team.js"></script>
    <script type="text/javascript" src="scripts/page.js"></script>
    <script type="text/javascript" src="scripts/words.js"></script>
    <script type="text/javascript" src="scripts/emotes.js"></script>
    <script type="text/javascript" src="scripts/main.js"></script>
  </body>
</html>
