<html>
  <head>
    <title>EDF RDDI Stand Up</title>
    <link rel="stylesheet" type="text/css" href="stylesheets/css/main.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <style id="name-wheel-style"></style>
  </head>
  <body>
    <header>
      <div class="container">
        <h1>Digital Innovation - Stand Up</h1>
        <div class="left">
          <div id="mute-button" class="header-button">
            <input id="mute-input" type="checkbox" name="mute"/>
            <label class="icon" for="mute-input">
              <span class="fa fa-volume-up"></span>
              <span class="fa fa-volume-off"></span>
            </label>
          </div>
        </div>
        <div class="right">
          <a class="header-button" id="settings-button">
            <div class="icon">
              <span class="fa fa-cog"></span>
              <span class="fa fa-lock"></span>
            </div>
            <div class="corner t"></div>
            <div class="corner r"></div>
            <div class="corner b"></div>
            <div class="corner l"></div>
          </a>
        </div>
      </div>
      <div class="container collapser closed">
        <form id="input-form">
          <label>Duration</label>
          <div class="select-strip">
            <input id="dur-1" type="radio" name="duration" value="1" class="set-check"/>
            <label for="dur-1" class="extra">1 each</label>
            <input id="dur-5" type="radio" name="duration" value="5" class="set-check"/>
            <label for="dur-5">5</label>
            <input id="dur-10" type="radio" name="duration" value="10" class="set-check"/>
            <label for="dur-10">10</label>
            <input id="dur-15" type="radio" name="duration" value="15" class="set-check"/>
            <label for="dur-15">15</label>
            <input id="dur-20" type="radio" name="duration" value="20" class="set-check"/>
            <label for="dur-20">20</label>
            <input id="dur-25" type="radio" name="duration" value="25" class="set-check"/>
            <label for="dur-25">25</label>
            <input id="dur-30" type="radio" name="duration" value="30" class="set-check"/>
            <label for="dur-30">30</label>
            <input id="dur-35" type="radio" name="duration" value="35" class="set-check"/>
            <label for="dur-35">35</label>
            <input id="dur-40" type="radio" name="duration" value="40" class="set-check"/>
            <label for="dur-40">40</label>
            <input id="dur-45" type="radio" name="duration" value="45" class="set-check"/>
            <label for="dur-45">45</label>
            <input id="dur-50" type="radio" name="duration" value="50" class="set-check"/>
            <label for="dur-50">50</label>
            <input id="dur-55" type="radio" name="duration" value="55" class="set-check"/>
            <label for="dur-55">55</label>
            <input id="dur-60" type="radio" name="duration" value="60" class="set-check"/>
            <label for="dur-60">60</label>
          </div>
          <label>Team Members</label>
          <div class="select-strip" id="team-members">
          </div>
          <input id="set-button" type="submit" value="Set" class="button disabled"></input>
        </form>
      </div>
    </header>
    <div class="container pad">
      <div class="active-team-list" id="left-list">

      </div>
      <div class="active-team-list" id="right-list">

      </div>
      <div id="name-wheel"></div>
      <div id="name-obscurer"></div>
      <div id="timer" class="timer">
        <div class="hand-holder">
          <div class="hand"></div>
        </div>
        <div class="hand-holder right">
          <div class="hand"></div>
        </div>
        <div class="timer-display">00:00</div>

        <div class="backing"></div>

      </div>

      <div id="sub-timer" class="timer">
        <div class="hand-holder">
          <div class="hand"></div>
        </div>
        <div class="hand-holder right">
          <div class="hand"></div>
        </div>
        <div class="timer-display">00:00</div>
        <a id="start-button" class="button hidden">START</a>
        <a id="end-button" class="button hidden">END</a>
        <a id="reset-button" class="button hidden">RESET</a>
        <a id="next-button" class="button hidden">NEXT</a>
        <a id="pep-button" class="button hidden">PEP TALK</a>
      </div>

      <div id="team-remaining">0/0</div>

      <div id="end-screen" class="hidden">
        <div>You achieved a <span id="end-time"></span> stand up, with an average of <span id="avg-time"></span> per person</div>
        <div id="pep-display"></div>
      </div>
    </div>

    <div id="team-modal" class="modal hidden">
      
      <div class="container">
        <span id="team-modal-close" class="fa fa-times"></span>
        <h2>Manage Team</h2>
        <div id="team-editor">
          <div id="team-editor-list">

          </div>
          <div class="team-add-input">
            <input type="text" id="team-add-input" name="team-add"/>
          </div>

        </div>
      </div>
    </div>
    <script type="text/javascript" src="scripts/memory.js"></script>
    <script type="text/javascript" src="scripts/team.js"></script>
    <script type="text/javascript" src="scripts/main.js"></script>
  </body>
</html>
