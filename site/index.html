<html>
  <head>
    <title>EDF RDDI Stand Up</title>
    <link rel="stylesheet" type="text/css" href="stylesheets/css/main.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <link rel="icon" type="image/x-icon" href="./favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <style id="name-wheel-style"></style>
  </head>
  <body>
    <header>
      <div class="container">
        <h1 id="title">Digital Innovation - Stand Up</h1>
        <div class="left">
          <div id="mute-button" class="header-button">
            <input id="mute-input" type="checkbox" name="mute" class="option-control"/>
            <label class="icon" for="mute-input">
              <span class="fa fa-volume-up"></span>
              <span class="fa fa-volume-off"></span>
            </label>
          </div>
        </div>
        <div class="right">
          <a class="header-button" id="settings-button">
            <div class="icon">
              <span class="fa fa-cog"></span>
              <span class="fa fa-lock"></span>
            </div>
            <div class="corner t"></div>
            <div class="corner r"></div>
            <div class="corner b"></div>
            <div class="corner l"></div>
          </a>
        </div>
      </div>
      <div class="container collapser closed">
        <form id="input-form">
          <label>Team<div id="edit-team" class="edit-button"><span class="fa fa-pencil-square-o"></div></label>
            <div class="select-strip" id="team-members">
            </div>
          <label>Duration</label>
          <div class="select-strip">
          <div>
            <input id="time-slider" type="range" name="duration" value="1" class="set-check" min="1" max="60"/>

            <input id="pp" type="checkbox" name="pp" class="option-checkbox option-control"/>
            <label for="pp" data-info="Do you want the time to be per person?">pp</label>
          </div>
        
            <div id="duration-display"></div>
          </div>
          <label>Options</label>
          <div class="select-strip" id="options">
            <input id="pausable" type="checkbox" name="pausable" class="option-checkbox option-control"/>
            <label for="pausable" data-info="Do you want a pause button on the timer?">Pausable</label>
            <input id="collect-time" type="checkbox" name="collectTime" class="option-checkbox option-control"/>
            <label for="collect-time" data-info="Do you want a team member's unused time to be split amongst everyone else?">Collect Time</label>
          </div>
          <input id="set-button" type="submit" value="Set" class="button disabled"></input>
        </form>
      </div>
    </header>
    <div class="container pad">
      <div class="active-team-list" id="left-list">

      </div>
      <div class="active-team-list" id="right-list">

      </div>
      <div id="name-wheel"></div>
      <div id="name-obscurer"></div>
      <div id="timer" class="timer">
        <div class="hand-holder">
          <div class="hand"></div>
        </div>
        <div class="hand-holder right">
          <div class="hand"></div>
        </div>
        <div class="timer-display">00:00</div>

        <div class="backing"></div>

      </div>

      <div id="sub-timer" class="timer">
        <div class="hand-holder">
          <div class="hand"></div>
        </div>
        <div class="hand-holder right">
          <div class="hand"></div>
        </div>
        <div class="timer-display">00:00</div>
        <a id="pause-button" class="button symbol paused hidden">
          <span class="fa fa-play pos-main"></span>
        <a id="end-button" class="button symbol hidden">
          <span class="fa fa-stop pos-main"></span>
        </a>
        <a id="reset-button" class="button hidden">RESET</a>
        <a id="next-button" class="button symbol hidden">
          <span class="fa fa-step-forward pos-main"></span>
        </a>
        <a id="pep-button" class="button hidden">PEP TALK</a>
      </div>

      <div id="team-remaining">0/0</div>

      <div id="end-screen" class="hidden">
        <div>You achieved a <span id="end-time"></span> stand up, with an average of <span id="avg-time"></span> per person</div>
        <div id="pep-display"></div>
      </div>
    </div>

    <div id="team-modal" class="modal hidden">
      
      <div class="container">
        <span id="team-modal-close" class="fa fa-times"></span>
        <h2>Manage Team</h2>
        <input type="text" id="meeting-name-input" name="meeting-name" placeholder="Team name"/>
        <div id="team-editor">
          <div id="team-editor-list">

          </div>
          <div class="member-name-input">
            <input type="text" id="member-name-input" name="member-name" placeholder="Add Member"/>
          </div>

        </div>
      </div>
    </div>
    <script type="text/javascript" src="scripts/memory.js"></script>
    <script type="text/javascript" src="scripts/team.js"></script>
    <script type="text/javascript" src="scripts/main.js"></script>
  </body>
</html>
